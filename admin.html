<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wenix · CMS Administrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e2e2e2; }
        h1, h2, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
<div class="max-w-5xl mx-auto">
    <div id="loading" class="text-center py-20 text-neutral-500 text-sm">Načítání systému...</div>

    <!-- Login -->
    <div id="login-view" class="hidden max-w-sm mx-auto mt-20 p-6 bg-[#111] border border-white/10 rounded-xl space-y-4">
        <h1 class="text-3xl text-white text-center">WENIX ADMIN</h1>
        <input id="email" type="email" placeholder="E-mail" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:border-[#14968C]">
        <input id="password" type="password" placeholder="Heslo" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:border-[#14968C]">
        <button id="btn-login" class="w-full bg-white hover:bg-neutral-200 text-black font-semibold py-2.5 rounded-lg text-sm transition">Přihlásit se</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="hidden space-y-8">
        <header class="flex justify-between items-center border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl text-white">SPRÁVA WEBU WENIX</h1>
                <p class="text-xs text-neutral-400 font-mono">VIZUÁLNÍ SPRÁVCE OBSAHU A STRÁNEK</p>
            </div>
            <div class="flex items-center gap-4">
                <span id="toast" class="text-xs text-[#14968C] font-semibold transition-opacity opacity-0">ULOŽENO</span>
                <button id="btn-logout" class="text-xs border border-white/10 hover:border-white/30 px-3 py-1.5 rounded-lg text-neutral-300">Odhlásit se</button>
            </div>
        </header>

        <div class="space-y-6">
            <div class="flex flex-wrap justify-between items-center gap-3">
                <div class="flex flex-wrap gap-2" id="page-tabs"></div>

                <div class="flex items-center gap-2">
                    <button onclick="window.openNewPageModal()" class="px-3.5 py-2 bg-white/10 text-white font-semibold text-xs rounded-lg hover:bg-white/20 transition flex items-center gap-1.5 border border-white/10">
                        <i class="bx bx-file-blank text-sm"></i> Vytvořit novou stránku
                    </button>
                    <button onclick="window.openNewFieldModal()" class="px-3.5 py-2 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400 transition flex items-center gap-1.5">
                        <i class="bx bx-plus text-sm"></i> Přidat prvek na tuto stránku
                    </button>
                </div>
            </div>

            <div id="page-info-bar" class="hidden bg-[#111] border border-teal-500/30 p-4 rounded-xl flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-neutral-400 font-mono">Veřejný odkaz:</span>
                    <a id="page-direct-link" href="#" target="_blank" class="text-xs text-[#14968C] underline font-mono"></a>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="window.addToNavigation()" class="px-3 py-1.5 bg-white/5 border border-white/15 text-xs text-neutral-200 rounded-lg hover:bg-white/10 transition">
                        + Přidat do Burger menu
                    </button>
                    <a id="page-visit-btn" href="#" target="_blank" class="px-3 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400 transition">
                        Otevřít stránku ↗
                    </a>
                </div>
            </div>

            <div id="fields-container" class="space-y-4"></div>
        </div>
    </div>
</div>

<!-- MODAL: NOVÁ STRÁNKA -->
<div id="modal-new-page" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-[#111] border border-white/10 rounded-xl p-6 max-w-md w-full space-y-4">
        <h3 class="text-xl text-white">VYTVOŘIT NOVOU STRÁNKU</h3>
        <div>
            <label class="text-xs text-neutral-400 font-mono">URL slug (např. blog, tym, reference):</label>
            <input id="np-page-slug" placeholder="novinky" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-teal-400 font-mono outline-none focus:border-[#14968C]">
        </div>
        <div>
            <label class="text-xs text-neutral-400 font-mono">Hlavní nadpis nové stránky:</label>
            <input id="np-page-title" placeholder="Novinky a články" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 outline-none focus:border-[#14968C]">
        </div>
        <div class="flex gap-2 justify-end pt-2">
            <button onclick="document.getElementById('modal-new-page').classList.add('hidden')" class="px-3.5 py-1.5 border border-white/10 text-xs rounded-lg text-neutral-400 hover:text-white">Zrušit</button>
            <button onclick="window.submitNewPage()" class="px-3.5 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400">Vytvořit stránku</button>
        </div>
    </div>
</div>

<!-- MODAL: NOVÝ PRVEK -->
<div id="modal-new-field" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-[#111] border border-white/10 rounded-xl p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto">
        <h3 class="text-xl text-white">PŘIDAT PRVEK DO STRÁNKY</h3>
        <div>
            <label class="text-xs text-neutral-400 font-mono">Typ prvku:</label>
            <select id="nf-preset" onchange="window.applyFieldPreset(this.value)" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2.5 text-xs text-neutral-200 mt-1 focus:border-[#14968C] outline-none">
                <option value="text">Jednořádkový text (Nadpis, slogan)</option>
                <option value="textarea">Textový odstavec / Popis</option>
                <option value="hero">Hero Nadpis s barevným gradientem</option>
                <option value="image">Obrázek nebo Banner</option>
                <option value="button">Tlačítko s cílovým odkazem (URL)</option>
                <option value="card">Obsahový blok (Karta)</option>
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <div class="flex justify-between items-center">
                    <label class="text-xs text-neutral-400 font-mono">Cílová stránka:</label>
                    <label class="text-[10px] text-teal-400 cursor-pointer flex items-center gap-1">
                        <input type="checkbox" id="nf-custom-page-toggle" onchange="window.toggleCustomPageInput(this.checked)">
                        Vlastní zadání
                    </label>
                </div>

                <select id="nf-page" onchange="window.onPageSelectChange(this.value)" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-teal-400 font-semibold outline-none focus:border-[#14968C]"></select>
                <input id="nf-page-custom" oninput="window.onPageSelectChange(this.value)" placeholder="např. novinky, sluzby" class="hidden w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-teal-400 font-mono outline-none focus:border-[#14968C]">
            </div>
            <div>
                <label class="text-xs text-neutral-400 font-mono">Název sekce:</label>
                <input id="nf-section" placeholder="např. Hero, O nás, Galerie" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 outline-none focus:border-[#14968C]">
            </div>
        </div>

        <div>
            <label class="text-xs text-neutral-400 font-mono">Popisek prvku v administraci:</label>
            <input id="nf-label" placeholder="např. Hlavní tlačítko" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 outline-none focus:border-[#14968C]">
        </div>

        <div>
            <label class="text-xs text-neutral-400 font-mono">Unikátní klíč (data-cms="..."):</label>
            <input id="nf-key" placeholder="např. test_btn_1" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 font-mono text-teal-400 outline-none focus:border-[#14968C]">
        </div>
        <input type="hidden" id="nf-type" value="text">

        <!-- Pole pro tlačítko -->
        <div id="nf-btn-wrapper" class="hidden space-y-3">
            <div>
                <label class="text-xs text-neutral-400 font-mono">Text na tlačítku:</label>
                <input id="nf-btn-text" placeholder="např. Zjistit více" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 outline-none focus:border-[#14968C]">
            </div>
            <div>
                <label class="text-xs text-neutral-400 font-mono">Ruční URL adresa odkazu (např. https://instagram.com nebo kontakt.html):</label>
                <input id="nf-btn-link" placeholder="https://... nebo kontakt.html" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-teal-300 font-mono outline-none focus:border-[#14968C]">
            </div>
        </div>

        <div id="nf-standard-value-wrapper">
            <label class="text-xs text-neutral-400 font-mono">Obsah prvku:</label>
            <textarea id="nf-value" rows="3" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 outline-none focus:border-[#14968C]"></textarea>
        </div>

        <div class="flex gap-2 justify-end pt-2">
            <button onclick="document.getElementById('modal-new-field').classList.add('hidden')" class="px-3.5 py-1.5 border border-white/10 text-xs rounded-lg text-neutral-400 hover:text-white">Zrušit</button>
            <button onclick="window.submitNewField()" class="px-3.5 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400">Vložit na stránku</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://semffcznljmbmftbaogl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OSvxzzEtDG7zgkmaR4j5gw_2oY7otaQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let contentItems = [];
    let activePage = 'index';

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        document.getElementById('loading').classList.add('hidden');
        if (session) {
            document.getElementById('dashboard-view').classList.remove('hidden');
            await loadContent();
        } else {
            document.getElementById('login-view').classList.remove('hidden');
        }
    }

    document.getElementById('btn-login').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert('Chyba: ' + error.message);
        else location.reload();
    };

    document.getElementById('btn-logout').onclick = async () => {
        await supabase.auth.signOut();
        location.reload();
    };

    async function loadContent() {
        const { data } = await supabase
            .from('site_content')
            .select('*')
            .order('sort_order', { ascending: true })
            .order('updated_at', { ascending: false });

        if (data) {
            contentItems = data;
            const pages = [...new Set(contentItems.map(i => i.page))];
            if (!pages.includes(activePage) && pages.length > 0) {
                activePage = pages[0];
            }
            renderTabs();
            updatePageInfoBar();
            renderFields();
        }
    }

    function renderTabs() {
        const pages = [...new Set(contentItems.map(i => i.page))];
        document.getElementById('page-tabs').innerHTML = pages.map(p => `
        <button onclick="window.switchTab('${p}')" class="px-3.5 py-1.5 text-xs uppercase tracking-wider rounded-lg border transition ${
            activePage === p
                ? 'bg-[#14968C] text-black border-[#14968C] font-bold shadow-lg shadow-teal-900/30'
                : 'bg-[#111] text-neutral-400 border-white/10 hover:border-white/20'
        }">
          ${p}
        </button>
      `).join('');
    }

    function updatePageInfoBar() {
        const infoBar = document.getElementById('page-info-bar');
        const directLink = document.getElementById('page-direct-link');
        const visitBtn = document.getElementById('page-visit-btn');

        const isStatic = ['index', 'kariera', 'kontakt', 'privacy', 'cookies', 'reviews'].includes(activePage);
        const url = isStatic ? `${activePage}.html` : `clanek.html?p=${activePage}`;

        directLink.innerText = url;
        directLink.href = url;
        visitBtn.href = url;
        infoBar.classList.remove('hidden');
    }

    window.switchTab = (p) => {
        activePage = p;
        renderTabs();
        updatePageInfoBar();
        renderFields();
    };

    function renderFields() {
        const container = document.getElementById('fields-container');
        const filtered = contentItems.filter(i => i.page === activePage);

        if (filtered.length === 0) {
            container.innerHTML = '<div class="bg-[#111] p-8 text-center text-neutral-500 rounded-xl text-sm font-mono">Tato stránka zatím nemá žádné prvky. Klikněte nahoře na "+ Přidat prvek na tuto stránku".</div>';
            return;
        }

        container.innerHTML = filtered.map((f, index) => {
            const isBtn = f.type === 'button' || f.key.includes('btn_');
            let btnText = f.value || '';
            let btnLink = '';
            if (isBtn && (f.value || '').includes('|')) {
                const parts = f.value.split('|');
                btnText = parts[0].trim();
                btnLink = parts[1].trim();
            }

            return `
        <div class="bg-[#111] border border-white/10 p-5 rounded-xl space-y-3 transition hover:border-white/20">
          <div class="flex items-center justify-between border-b border-white/5 pb-2.5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono px-2 py-0.5 bg-white/5 text-neutral-400 rounded">#${index + 1}</span>
              <span class="text-sm font-semibold text-white">${f.label}</span>
              <span class="text-xs text-neutral-500 font-mono">(${f.key})</span>
              <span class="text-[10px] text-teal-400 bg-teal-950/60 border border-teal-800/40 px-2 py-0.5 rounded-full uppercase">${f.section}</span>
            </div>

            <div class="flex items-center gap-1">
              <button onclick="window.moveItem('${f.key}', -1)" ${index === 0 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:bg-white/10 text-neutral-300"'} title="Posunout výš" class="p-1.5 rounded-md text-xs transition">
                <i class="bx bx-chevron-up text-base"></i>
              </button>
              <button onclick="window.moveItem('${f.key}', 1)" ${index === filtered.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:bg-white/10 text-neutral-300"'} title="Posunout níž" class="p-1.5 rounded-md text-xs transition">
                <i class="bx bx-chevron-down text-base"></i>
              </button>
              <button onclick="window.deleteItem('${f.key}')" title="Smazat prvek" class="p-1.5 rounded-md text-xs text-red-400 hover:bg-red-500/10 transition ml-2">
                <i class="bx bx-trash text-base"></i>
              </button>
            </div>
          </div>

          <div>
            ${isBtn ? `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] text-neutral-400 font-mono">Text tlačítka:</label>
                  <input type="text" value="${btnText}" onblur="window.saveButtonField('${f.key}', this.value, document.getElementById('link-${f.key}').value)" id="text-${f.key}" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2.5 text-sm text-neutral-200 outline-none mt-1">
                </div>
                <div>
                  <label class="text-[11px] text-neutral-400 font-mono">URL adresa odkazu:</label>
                  <input type="text" value="${btnLink}" onblur="window.saveButtonField('${f.key}', document.getElementById('text-${f.key}').value, this.value)" id="link-${f.key}" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2.5 text-sm text-teal-300 font-mono outline-none mt-1" placeholder="https://... nebo kontakt.html">
                </div>
              </div>
            ` : f.type === 'textarea' ? `
              <textarea onblur="window.saveField('${f.key}', this.value)" rows="3" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-3 text-sm text-neutral-200 outline-none transition">${f.value || ''}</textarea>
            ` : f.type === 'image' ? `
              <div class="flex items-center gap-4">
                <img src="${f.value || ''}" class="w-16 h-16 rounded-lg object-cover bg-black border border-white/10" id="preview-${f.key}">
                <div class="flex-1 space-y-2">
                  <input type="text" value="${f.value || ''}" onblur="window.saveField('${f.key}', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2 text-xs text-neutral-200 outline-none" placeholder="URL obrázku">
                  <input type="file" accept="image/*" onchange="window.uploadImage('${f.key}', this)" class="text-xs text-neutral-400 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-white/10 file:text-neutral-200 hover:file:bg-white/20">
                </div>
              </div>
            ` : `
              <input type="text" value="${f.value || ''}" onblur="window.saveField('${f.key}', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2.5 text-sm text-neutral-200 outline-none transition">
            `}
          </div>
        </div>
      `;
        }).join('');
    }

    window.saveButtonField = async (key, text, link) => {
        const combined = `${text.trim()} | ${link.trim()}`;
        await window.saveField(key, combined);
    };

    window.addToNavigation = async () => {
        const linkUrl = `clanek.html?p=${activePage}`;
        const linkText = activePage.toUpperCase();
        const navKeyText = `nav_btn_${activePage}_text`;
        const navKeyHref = `nav_btn_${activePage}_href`;

        await supabase.from('site_content').upsert([
            { key: navKeyText, page: 'index', section: 'Navigace', label: `Odkaz v menu - ${linkText}`, type: 'text', value: linkText, sort_order: 1 },
            { key: navKeyHref, page: 'index', section: 'Navigace', label: `Odkaz v menu URL - ${linkText}`, type: 'text', value: linkUrl, sort_order: 2 }
        ]);

        alert(`Stránka byla přidána do Burger menu (Text: ${linkText}, Odkaz: ${linkUrl})!`);
        await loadContent();
    };

    window.moveItem = async (key, direction) => {
        const pageItems = contentItems.filter(i => i.page === activePage);
        const currentIndex = pageItems.findIndex(i => i.key === key);
        const targetIndex = currentIndex + direction;

        if (targetIndex < 0 || targetIndex >= pageItems.length) return;

        const currentItem = pageItems[currentIndex];
        const targetItem = pageItems[targetIndex];

        const tempOrder = currentItem.sort_order || currentIndex;
        currentItem.sort_order = targetItem.sort_order || targetIndex;
        targetItem.sort_order = tempOrder;

        if (currentItem.sort_order === targetItem.sort_order) {
            currentItem.sort_order = targetIndex;
            targetItem.sort_order = currentIndex;
        }

        await Promise.all([
            supabase.from('site_content').update({ sort_order: currentItem.sort_order }).eq('key', currentItem.key),
            supabase.from('site_content').update({ sort_order: targetItem.sort_order }).eq('key', targetItem.key)
        ]);

        await loadContent();
        showToast();
    };

    window.saveField = async (key, value) => {
        const { error } = await supabase.from('site_content').update({ value, updated_at: new Date().toISOString() }).eq('key', key);
        if (!error) showToast();
    };

    window.deleteItem = async (key) => {
        if (!confirm(`Opravdu chcete smazat prvek ${key}?`)) return;
        await supabase.from('site_content').delete().eq('key', key);
        await loadContent();
    };

    window.uploadImage = async (key, input) => {
        const file = input.files[0];
        if (!file) return;
        const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
        const { error } = await supabase.storage.from('site-assets').upload(fileName, file);
        if (error) return alert('Chyba: ' + error.message);

        const { data: { publicUrl } } = supabase.storage.from('site-assets').getPublicUrl(fileName);
        await window.saveField(key, publicUrl);
        document.getElementById(`preview-${key}`).src = publicUrl;
        await loadContent();
    };

    window.openNewPageModal = () => {
        document.getElementById('np-page-slug').value = '';
        document.getElementById('np-page-title').value = '';
        document.getElementById('modal-new-page').classList.remove('hidden');
    };

    window.submitNewPage = async () => {
        const slug = document.getElementById('np-page-slug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        const title = document.getElementById('np-page-title').value.trim();

        if (!slug || !title) return alert('Vyplňte název i URL identifikátor stránky!');

        const key = `${slug}_main_heading`;
        const { error } = await supabase.from('site_content').insert([{
            key: key,
            page: slug,
            section: 'Hlavička',
            label: 'Hlavní nadpis stránky',
            type: 'text',
            value: title,
            sort_order: 1
        }]);

        if (error) return alert('Chyba při vytváření stránky: ' + error.message);

        document.getElementById('modal-new-page').classList.add('hidden');
        activePage = slug;
        await loadContent();
        showToast();
    };

    window.openNewFieldModal = () => {
        const pageSelect = document.getElementById('nf-page');
        const pages = [...new Set(contentItems.map(i => i.page))];

        pageSelect.innerHTML = pages.map(p => `
        <option value="${p}" ${p === activePage ? 'selected' : ''}>${p.toUpperCase()}</option>
      `).join('');

        document.getElementById('nf-custom-page-toggle').checked = false;
        document.getElementById('nf-page').classList.remove('hidden');
        document.getElementById('nf-page-custom').classList.add('hidden');

        window.applyFieldPreset(document.getElementById('nf-preset').value || 'text');
        document.getElementById('modal-new-field').classList.remove('hidden');
    };

    window.toggleCustomPageInput = (isCustom) => {
        const select = document.getElementById('nf-page');
        const input = document.getElementById('nf-page-custom');
        if (isCustom) {
            select.classList.add('hidden');
            input.classList.remove('hidden');
            input.value = activePage;
        } else {
            select.classList.remove('hidden');
            input.classList.add('hidden');
        }
        window.onPageSelectChange(isCustom ? input.value : select.value);
    };

    window.getSelectedTargetPage = () => {
        const isCustom = document.getElementById('nf-custom-page-toggle').checked;
        if (isCustom) {
            return (document.getElementById('nf-page-custom').value || activePage).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        }
        return document.getElementById('nf-page').value || activePage;
    };

    window.onPageSelectChange = () => {
        window.applyFieldPreset(document.getElementById('nf-preset').value);
    };

    window.applyFieldPreset = (preset) => {
        const targetPage = window.getSelectedTargetPage();
        const keyInput = document.getElementById('nf-key');
        const labelInput = document.getElementById('nf-label');
        const typeInput = document.getElementById('nf-type');
        const valInput = document.getElementById('nf-value');
        const btnWrapper = document.getElementById('nf-btn-wrapper');
        const stdWrapper = document.getElementById('nf-standard-value-wrapper');
        const prefix = `${targetPage}_`;

        if (preset === 'button') {
            btnWrapper.classList.remove('hidden');
            stdWrapper.classList.add('hidden');
            typeInput.value = 'button';
            labelInput.value = 'Tlačítko';
            keyInput.value = `${prefix}btn_${Date.now().toString().slice(-4)}`;
            document.getElementById('nf-btn-text').value = 'Zjistit více';
            document.getElementById('nf-btn-link').value = 'https://';
        } else {
            btnWrapper.classList.add('hidden');
            stdWrapper.classList.remove('hidden');

            if (preset === 'text') {
                typeInput.value = 'text';
                labelInput.value = 'Nový nadpis / text';
                keyInput.value = `${prefix}heading_${Date.now().toString().slice(-4)}`;
                valInput.value = 'Ukázkový text sekce';
            } else if (preset === 'textarea') {
                typeInput.value = 'textarea';
                labelInput.value = 'Odstavec textu';
                keyInput.value = `${prefix}perex_${Date.now().toString().slice(-4)}`;
                valInput.value = 'Podrobný popis sekce a odstavce...';
            } else if (preset === 'hero') {
                typeInput.value = 'textarea';
                labelInput.value = 'Hero nadpis s gradientem';
                keyInput.value = `${prefix}hero_${Date.now().toString().slice(-4)}`;
                valInput.value = 'NADPIS NA<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-cyan-400 to-blue-400">MAXIMUM</span>';
            } else if (preset === 'image') {
                typeInput.value = 'image';
                labelInput.value = 'Obrázek / Fotka';
                keyInput.value = `${prefix}img_${Date.now().toString().slice(-4)}`;
                valInput.value = 'images/web-banner.png';
            } else if (preset === 'card') {
                typeInput.value = 'textarea';
                labelInput.value = 'Karta / Blok';
                keyInput.value = `${prefix}card_${Date.now().toString().slice(-4)}`;
                valInput.value = '<div class="p-6 bg-white/5 border border-white/10 rounded-xl"><h3 class="text-white font-bold text-lg mb-2">Titulek karty</h3><p class="text-gray-400 text-sm">Obsah karty...</p></div>';
            }
        }
    };

    window.submitNewField = async () => {
        const key = document.getElementById('nf-key').value.trim();
        const page = window.getSelectedTargetPage();
        const section = document.getElementById('nf-section').value.trim() || 'Obecné';
        const label = document.getElementById('nf-label').value.trim();
        const type = document.getElementById('nf-type').value;

        let value = '';
        if (type === 'button') {
            const t = document.getElementById('nf-btn-text').value.trim() || 'Tlačítko';
            const l = document.getElementById('nf-btn-link').value.trim() || '#';
            value = `${t} | ${l}`;
        } else {
            value = document.getElementById('nf-value').value;
        }

        if (!key || !page || !label) return alert('Vyplňte klíč a popisek!');

        const maxOrder = contentItems.filter(i => i.page === page).reduce((max, i) => Math.max(max, i.sort_order || 0), 0);

        const { error } = await supabase.from('site_content').insert([{
            key, page, section, label, type, value, sort_order: maxOrder + 1
        }]);

        if (error) return alert('Chyba: ' + error.message);

        document.getElementById('modal-new-field').classList.add('hidden');
        activePage = page;
        await loadContent();
        showToast();
    };

    function showToast() {
        const t = document.getElementById('toast');
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2000);
    }

    init();
</script>
</body>
</html>
