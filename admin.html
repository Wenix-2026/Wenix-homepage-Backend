<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wenix · CMS Administrace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e2e2e2; }
        h1, h2, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
<div class="max-w-5xl mx-auto">
    <div id="loading" class="text-center py-20 text-neutral-500 text-sm">Načítání systému...</div>

    <!-- Login formulář -->
    <div id="login-view" class="hidden max-w-sm mx-auto mt-20 p-6 bg-[#111] border border-white/10 rounded-xl space-y-4">
        <h1 class="text-3xl text-white text-center">WENIX ADMIN</h1>
        <input id="email" type="email" placeholder="E-mail" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:border-[#14968C]">
        <input id="password" type="password" placeholder="Heslo" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2.5 text-sm outline-none focus:border-[#14968C]">
        <button id="btn-login" class="w-full bg-white hover:bg-neutral-200 text-black font-semibold py-2.5 rounded-lg text-sm transition">Přihlásit se</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="hidden space-y-8">
        <header class="flex justify-between items-center border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl text-white">SPRÁVA WEBU WENIX</h1>
                <p class="text-xs text-neutral-400 font-mono">CMS PRO TEXTY, OBRÁZKY A DYNAMICKÉ STRÁNKY</p>
            </div>
            <div class="flex items-center gap-4">
                <span id="toast" class="text-xs text-[#14968C] font-semibold transition-opacity opacity-0">ULOŽENO</span>
                <button id="btn-logout" class="text-xs border border-white/10 hover:border-white/30 px-3 py-1.5 rounded-lg text-neutral-300">Odhlásit se</button>
            </div>
        </header>

        <!-- Přepínač sekcí -->
        <div class="flex gap-4 border-b border-white/10 pb-4">
            <button onclick="window.switchSection('content')" id="tab-btn-content" class="text-sm font-semibold pb-1 border-b-2 border-[#14968C] text-white">Texty a Média</button>
            <button onclick="window.switchSection('pages')" id="tab-btn-pages" class="text-sm font-semibold pb-1 border-b-2 border-transparent text-neutral-400 hover:text-white">Dynamické stránky (Články / Blog)</button>
        </div>

        <!-- 1. SEKCE: STATICKÉ TEXTY A MÉDIA -->
        <div id="section-content" class="space-y-6">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div class="flex flex-wrap gap-2" id="page-tabs"></div>
                <button onclick="window.openNewFieldModal()" class="px-3 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400 transition">+ Přidat prvek / pole</button>
            </div>
            <div id="fields-container" class="space-y-6"></div>
        </div>

        <!-- 2. SEKCE: DYNAMICKÉ STRÁNKY -->
        <div id="section-pages" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl text-white">Vytvořené stránky a články</h2>
                <button onclick="window.openNewPageModal()" class="px-3 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400 transition">+ Vytvořit novou stránku</button>
            </div>
            <div id="pages-list" class="space-y-3"></div>
        </div>
    </div>
</div>

<!-- MODAL: PŘIDAT NOVÉ POLE S PRESETY -->
<div id="modal-new-field" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-[#111] border border-white/10 rounded-xl p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto">
        <h3 class="text-xl text-white">PŘIDAT ELEMENT DO WEBU</h3>

        <!-- Volba předpřipravené šablony -->
        <div>
            <label class="text-xs text-neutral-400 font-mono">Vyberte předlohu prvku:</label>
            <select id="nf-preset" onchange="window.applyFieldPreset(this.value)" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2.5 text-xs text-neutral-200 mt-1 focus:border-[#14968C] outline-none">
                <option value="text">Jednoduchý jednořádkový text (Nadpis, slogan)</option>
                <option value="textarea">Dlouhý textový odstavec / Popis</option>
                <option value="hero">Hero Sekce (Nadpis s gradientním slovem)</option>
                <option value="image">Obrázek nebo Banner</option>
                <option value="button">Tlačítko / CTA Odkaz</option>
                <option value="card">Obsahová karta (HTML blok)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-xs text-neutral-400 font-mono">Stránka webu:</label>
                <input id="nf-page" placeholder="např. index, kariera" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1">
            </div>
            <div>
                <label class="text-xs text-neutral-400 font-mono">Sekce webu:</label>
                <input id="nf-section" placeholder="např. Hero, Služby" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1">
            </div>
        </div>

        <div>
            <label class="text-xs text-neutral-400 font-mono">Popisek prvku v administraci:</label>
            <input id="nf-label" placeholder="např. Hlavní titulek nabídky" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1">
        </div>

        <div>
            <label class="text-xs text-neutral-400 font-mono">Unikátní HTML klíč (data-cms="..."):</label>
            <input id="nf-key" placeholder="např. home_promo_title" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 font-mono text-teal-400">
        </div>

        <input type="hidden" id="nf-type" value="text">

        <div>
            <label class="text-xs text-neutral-400 font-mono">Výchozí hodnota / Obsah:</label>
            <textarea id="nf-value" rows="3" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 outline-none"></textarea>
        </div>

        <div class="flex gap-2 justify-end pt-2">
            <button onclick="document.getElementById('modal-new-field').classList.add('hidden')" class="px-3 py-1.5 border border-white/10 text-xs rounded-lg text-neutral-400 hover:text-white">Zrušit</button>
            <button onclick="window.submitNewField()" class="px-3 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400">Uložit prvek</button>
        </div>
    </div>
</div>

<!-- MODAL: VYTVOŘIT / UPRAVIT STRÁNKU -->
<div id="modal-page-editor" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-[#111] border border-white/10 rounded-xl p-6 max-w-xl w-full space-y-4 max-h-[90vh] overflow-y-auto">
        <h3 id="page-modal-title" class="text-xl text-white">VYTVOŘIT STRÁNKU / ČLÁNEK</h3>
        <input type="hidden" id="pe-is-edit" value="false">

        <div>
            <label class="text-xs text-neutral-400 font-mono">URL Slug (adresa článku):</label>
            <input id="pe-slug" placeholder="např. novy-web-design" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 font-mono text-teal-400">
        </div>
        <div>
            <label class="text-xs text-neutral-400 font-mono">Nadpis stránky:</label>
            <input id="pe-title" placeholder="Zadejte název..." class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1">
        </div>
        <div>
            <label class="text-xs text-neutral-400 font-mono">Perex / Úvodní shrnutí:</label>
            <textarea id="pe-perex" rows="2" placeholder="Krátký popis..." class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1"></textarea>
        </div>
        <div>
            <label class="text-xs text-neutral-400 font-mono">URL Titulního obrázku (volitelné):</label>
            <input id="pe-img" placeholder="https://..." class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1">
        </div>
        <div>
            <label class="text-xs text-neutral-400 font-mono">Obsah stránky (podporuje HTML odstavce):</label>
            <textarea id="pe-content" rows="7" placeholder="<p>Obsah článku...</p>" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg p-2 text-xs mt-1 text-neutral-200 font-mono"></textarea>
        </div>

        <div class="flex gap-2 justify-end pt-2">
            <button onclick="document.getElementById('modal-page-editor').classList.add('hidden')" class="px-3 py-1.5 border border-white/10 text-xs rounded-lg text-neutral-400 hover:text-white">Zrušit</button>
            <button onclick="window.submitPage()" class="px-3 py-1.5 bg-[#14968C] text-black font-semibold text-xs rounded-lg hover:bg-teal-400">Uložit stránku</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://semffcznljmbmftbaogl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OSvxzzEtDG7zgkmaR4j5gw_2oY7otaQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let contentItems = [];
    let pagesList = [];
    let activePage = 'all';

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        document.getElementById('loading').classList.add('hidden');
        if (session) {
            document.getElementById('dashboard-view').classList.remove('hidden');
            await loadAllData();
        } else {
            document.getElementById('login-view').classList.remove('hidden');
        }
    }

    // Přihlášení / Odhlášení
    document.getElementById('btn-login').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert('Chyba: ' + error.message);
        else location.reload();
    };

    document.getElementById('btn-logout').onclick = async () => {
        await supabase.auth.signOut();
        location.reload();
    };

    async function loadAllData() {
        const [resContent, resPages] = await Promise.all([
            supabase.from('site_content').select('*').order('page').order('section'),
            supabase.from('pages').select('*').order('created_at', { ascending: false })
        ]);

        if (resContent.data) contentItems = resContent.data;
        if (resPages.data) pagesList = resPages.data;

        renderTabs();
        renderContent();
    }

    // Vykreslení záložek v horní liště (obsahuje statické i nově vytvořené dynamické stránky)
    function renderTabs() {
        const staticPages = [...new Set(contentItems.map(i => i.page))];
        const dynamicPages = pagesList.map(p => `page:${p.slug}`);
        const allTabs = ['all', ...staticPages, ...dynamicPages];

        document.getElementById('page-tabs').innerHTML = allTabs.map(tab => {
            const isDynamic = tab.startsWith('page:');
            const slug = isDynamic ? tab.replace('page:', '') : tab;
            const label = tab === 'all' ? 'Všechny stránky' : (isDynamic ? `📄 ${slug}` : slug);

            return `
        <button onclick="window.switchTab('${tab}')" class="px-3 py-1 text-xs uppercase tracking-wider rounded-md border transition ${
                activePage === tab
                    ? 'bg-[#14968C] text-black border-[#14968C] font-semibold'
                    : 'bg-[#111] text-neutral-400 border-white/10 hover:border-white/20'
            }">
          ${label}
        </button>
      `;
        }).join('');
    }

    window.switchTab = (tab) => {
        activePage = tab;
        renderTabs();
        renderContent();
    };

    function renderContent() {
        const container = document.getElementById('fields-container');

        // Pokud uživatel kliknul na dynamickou stránku (např. 'page:muj-clanek')
        if (activePage.startsWith('page:')) {
            const slug = activePage.replace('page:', '');
            const page = pagesList.find(p => p.slug === slug);

            if (!page) {
                container.innerHTML = '<p class="text-xs text-neutral-500">Stránka nenalezena.</p>';
                return;
            }

            container.innerHTML = `
        <div class="bg-[#111] border border-white/10 p-6 rounded-xl space-y-5">
          <div class="flex justify-between items-center border-b border-white/5 pb-3">
            <h3 class="text-xl text-[#14968C]">STRÁNKA: ${page.title} (${page.slug})</h3>
            <div class="flex gap-2">
              <a href="clanek.html?p=${page.slug}" target="_blank" class="text-xs text-[#14968C] underline px-3 py-1.5">Zobrazit web ↗</a>
              <button onclick="window.deletePage('${page.slug}')" class="text-xs text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg hover:bg-red-500/10">Smazat stránku</button>
            </div>
          </div>

          <div class="space-y-4">
            <div>
              <label class="text-xs text-neutral-400 font-mono">Hlavní nadpis stránky:</label>
              <input type="text" value="${page.title || ''}" onblur="window.saveDynamicPage('${page.slug}', 'title', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2.5 text-sm text-neutral-200 outline-none mt-1">
            </div>

            <div>
              <label class="text-xs text-neutral-400 font-mono">Perex / Úvodní popis:</label>
              <textarea rows="2" onblur="window.saveDynamicPage('${page.slug}', 'perex', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2.5 text-sm text-neutral-200 outline-none mt-1">${page.perex || ''}</textarea>
            </div>

            <div>
              <label class="text-xs text-neutral-400 font-mono">Titulní obrázek (URL / Soubor):</label>
              <div class="flex items-center gap-4 mt-1">
                <img src="${page.cover_image || ''}" class="w-16 h-16 rounded-lg object-cover bg-black border border-white/10" id="preview-page-${page.slug}">
                <div class="flex-1 space-y-2">
                  <input type="text" value="${page.cover_image || ''}" onblur="window.saveDynamicPage('${page.slug}', 'cover_image', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2 text-xs text-neutral-200 outline-none" placeholder="Vlož URL nebo nahraj soubor">
                  <input type="file" accept="image/*" onchange="window.uploadPageImage('${page.slug}', this)" class="text-xs text-neutral-400 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-white/10 file:text-neutral-200 hover:file:bg-white/20">
                </div>
              </div>
            </div>

            <div>
              <label class="text-xs text-neutral-400 font-mono">Obsah stránky (podporuje HTML odstavce &lt;p&gt;):</label>
              <textarea rows="8" onblur="window.saveDynamicPage('${page.slug}', 'content', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-3 text-sm text-neutral-200 font-mono outline-none mt-1">${page.content || ''}</textarea>
            </div>
          </div>
        </div>
      `;
            return;
        }

        // Pro běžná statická pole (index, kontakt, kariera...)
        const filtered = activePage === 'all' ? contentItems : contentItems.filter(i => i.page === activePage);

        const grouped = filtered.reduce((acc, item) => {
            const group = `${item.page.toUpperCase()} · ${item.section}`;
            acc[group] = acc[group] || [];
            acc[group].push(item);
            return acc;
        }, {});

        container.innerHTML = Object.entries(grouped).map(([group, fields]) => `
      <div class="bg-[#111] border border-white/10 p-5 rounded-xl space-y-4">
        <h3 class="text-xl text-[#14968C] border-b border-white/5 pb-2">${group}</h3>
        <div class="space-y-4">
          ${fields.map(f => `
            <div class="space-y-1.5">
              <label class="text-xs text-neutral-400 font-mono">${f.label} <span class="text-neutral-600">(${f.key})</span></label>
              ${f.type === 'textarea' ? `
                <textarea onblur="window.saveField('${f.key}', this.value)" rows="3" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-3 text-sm text-neutral-200 outline-none transition">${f.value || ''}</textarea>
              ` : f.type === 'image' ? `
                <div class="flex items-center gap-4">
                  <img src="${f.value || ''}" class="w-16 h-16 rounded-lg object-cover bg-black border border-white/10" id="preview-${f.key}">
                  <div class="flex-1 space-y-2">
                    <input type="text" value="${f.value || ''}" onblur="window.saveField('${f.key}', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2 text-xs text-neutral-200 outline-none" placeholder="Vlož URL nebo nahraj soubor">
                    <input type="file" accept="image/*" onchange="window.uploadImage('${f.key}', this)" class="text-xs text-neutral-400 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-white/10 file:text-neutral-200 hover:file:bg-white/20">
                  </div>
                </div>
              ` : `
                <input type="text" value="${f.value || ''}" onblur="window.saveField('${f.key}', this.value)" class="w-full bg-[#0a0a0a] border border-white/10 focus:border-[#14968C] rounded-lg p-2.5 text-sm text-neutral-200 outline-none transition">
              `}
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
    }

    // Uložení statického pole
    window.saveField = async (key, value) => {
        const { error } = await supabase.from('site_content').update({ value, updated_at: new Date().toISOString() }).eq('key', key);
        if (!error) showToast();
    };

    // Uložení pole dynamické stránky
    window.saveDynamicPage = async (slug, column, value) => {
        const updateObj = { [column]: value, updated_at: new Date().toISOString() };
        const { error } = await supabase.from('pages').update(updateObj).eq('slug', slug);
        if (!error) {
            showToast();
            const page = pagesList.find(p => p.slug === slug);
            if (page) page[column] = value;
        }
    };

    // Nahrávání obrázků
    window.uploadImage = async (key, input) => {
        const file = input.files[0];
        if (!file) return;
        const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
        const { error } = await supabase.storage.from('site-assets').upload(fileName, file);
        if (error) return alert('Chyba: ' + error.message);

        const { data: { publicUrl } } = supabase.storage.from('site-assets').getPublicUrl(fileName);
        await window.saveField(key, publicUrl);
        document.getElementById(`preview-${key}`).src = publicUrl;
        await loadAllData();
    };

    window.uploadPageImage = async (slug, input) => {
        const file = input.files[0];
        if (!file) return;
        const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
        const { error } = await supabase.storage.from('site-assets').upload(fileName, file);
        if (error) return alert('Chyba: ' + error.message);

        const { data: { publicUrl } } = supabase.storage.from('site-assets').getPublicUrl(fileName);
        await window.saveDynamicPage(slug, 'cover_image', publicUrl);
        document.getElementById(`preview-page-${slug}`).src = publicUrl;
        await loadAllData();
    };

    // Vytvoření nové stránky
    window.submitPage = async () => {
        const slug = document.getElementById('pe-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
        const title = document.getElementById('pe-title').value;
        const perex = document.getElementById('pe-perex').value;
        const cover_image = document.getElementById('pe-img').value;
        const content = document.getElementById('pe-content').value;

        if (!slug || !title) return alert('Vyplňte slug i nadpis stránky!');

        const { error } = await supabase.from('pages').insert([{ slug, title, perex, cover_image, content }]);
        if (error) return alert('Chyba při vytváření: ' + error.message);

        document.getElementById('modal-page-editor').classList.add('hidden');
        await loadAllData();
        window.switchTab(`page:${slug}`); // Rovnou přepne na novou stránku
        showToast();
    };

    window.deletePage = async (slug) => {
        if (!confirm(`Opravdu chcete smazat stránku ${slug}?`)) return;
        const { error } = await supabase.from('pages').delete().eq('slug', slug);
        if (error) alert('Chyba: ' + error.message);
        activePage = 'all';
        await loadAllData();
    };

    function showToast() {
        const t = document.getElementById('toast');
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2000);
    }

    init();
</script>
</body>
</html>
