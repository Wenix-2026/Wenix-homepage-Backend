# config/packages/doctrine.yaml

doctrine:
    dbal:
        default_connection: tenant

        connections:
            master:
                driver: pdo_sqlite
                path: '%kernel.project_dir%/var/master.db'
                profiling_collect_backtrace: '%kernel.debug%'

            tenant:
                driver: pdo_sqlite
                path: '%kernel.project_dir%/var/tenant_default.db'
                profiling_collect_backtrace: '%kernel.debug%'

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        default_entity_manager: tenant
        controller_resolver:
            auto_mapping: false

        entity_managers:
            master:
                connection: master
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                report_fields_where_declared: true
                validate_xml_mapping: true
                mappings:
                    Master:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Master'
                        prefix: 'App\Entity\Master'
                        alias: Master

            tenant:
                connection: tenant
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                report_fields_where_declared: true
                validate_xml_mapping: true
                mappings:
                    Tenant:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Tenant'
                        prefix: 'App\Entity\Tenant'
                        alias: TenantEntity

when@test:
    doctrine:
        dbal:
            connections:
                master:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                tenant:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            entity_managers:
                master:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                tenant:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
