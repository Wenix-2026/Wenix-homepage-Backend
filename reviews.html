    <style>

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,0.06); transition: background 0.2s ease;
        }
        .nav-inner {
            max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 80px;

        }

            CO O NÁS ŘÍKAJÍ KLIENTI
        </h1>
        <p data-cms="reviews_subtitle" class="text-gray-300 text-base md:text-lg leading-relaxed max-w-2xl mx-auto">
