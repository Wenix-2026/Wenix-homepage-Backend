<!DOCTYPE html>
<html lang="cs">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-meta-title">Načítání... | Wenix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<header class="h-20 flex items-center px-6 max-w-6xl mx-auto w-full justify-between">
    <a href="index.html" class="font-bebas text-3xl text-white">Wenix</a>
    <a href="index.html" class="text-xs text-neutral-400 hover:text-white uppercase tracking-wider transition">← Zpět na web</a>
</header>

<main class="flex-grow pt-32 pb-20 px-6 max-w-4xl mx-auto w-full">
    <!-- Stav načítání -->
    <div id="page-loading" class="text-center py-20 text-neutral-500 font-mono text-sm">Načítání stránky...</div>

    <!-- Chyba 404 -->
    <div id="page-error" class="hidden text-center py-20">
        <h1 class="font-bebas text-5xl text-white mb-3">404 · STRÁNKA NENALEZENA</h1>
        <p class="text-neutral-400 text-sm mb-6">Tato stránka neexistuje nebo byla smazána.</p>
        <a href="index.html" class="px-5 py-2.5 bg-white text-black text-xs font-semibold rounded-lg">Zpět na hlavní stranu</a>
    </div>

    <!-- Samotný obsah -->
    <article id="page-article" class="hidden space-y-8">
        <div>
            <span id="page-date" class="text-xs font-mono text-[#14968C]"></span>
            <h1 id="page-title" class="font-bebas text-5xl md:text-7xl text-white mt-2 mb-4 leading-none"></h1>
            <p id="page-perex" class="text-neutral-400 text-base md:text-lg leading-relaxed"></p>
        </div>

        <div id="page-img-container" class="hidden rounded-2xl overflow-hidden border border-white/10 aspect-video max-h-[420px] bg-[#111]">
            <img id="page-img" src="" class="w-full h-full object-cover" alt="Banner">
        </div>

        <div id="page-content" class="text-neutral-300 text-sm md:text-base leading-relaxed space-y-4 pt-4 border-t border-white/5"></div>
    </article>
</main>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://semffcznljmbmftbaogl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OSvxzzEtDG7zgkmaR4j5gw_2oY7otaQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPage() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('p');

        if (!slug) {
            showError();
            return;
        }

        const { data, error } = await supabase.from('pages').select('*').eq('slug', slug).single();

        document.getElementById('page-loading').classList.add('hidden');

        if (error || !data) {
            showError();
            return;
        }

        document.getElementById('page-meta-title').innerText = `${data.title} | Wenix`;
        document.getElementById('page-title').innerText = data.title;
        document.getElementById('page-perex').innerText = data.perex || '';
        document.getElementById('page-content').innerHTML = data.content || '';
        document.getElementById('page-date').innerText = new Date(data.created_at).toLocaleDateString('cs-CZ');

        if (data.cover_image) {
            document.getElementById('page-img').src = data.cover_image;
            document.getElementById('page-img-container').classList.remove('hidden');
        }

        document.getElementById('page-article').classList.remove('hidden');
    }

    function showError() {
        document.getElementById('page-loading').classList.add('hidden');
        document.getElementById('page-error').classList.remove('hidden');
    }

    loadPage();
</script>
</body>
</html>
