<!DOCTYPE html>
<html lang="cs">
<head>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-meta-title">Wenix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 6px; padding: 12px 26px;
            background: #fff; color: #000; font-size: .9rem; font-weight: 500;
            border: 1px solid #fff; border-radius: 6px; cursor: pointer; text-decoration: none;
            transition: background .2s, color .2s, transform .15s; white-space: nowrap;
        }
        .btn-primary:hover { background: rgba(255,255,255,0.88); transform: translateY(-1px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<header class="h-20 flex items-center px-6 max-w-6xl mx-auto w-full justify-between">
    <a href="index.html" class="font-bebas text-3xl text-white">Wenix</a>
    <a href="index.html" class="text-xs text-neutral-400 hover:text-white uppercase tracking-wider transition">← Zpět na web</a>
</header>

<main class="flex-grow pt-32 pb-20 px-6 max-w-4xl mx-auto w-full">
    <div id="page-loading" class="text-center py-20 text-neutral-500 font-mono text-sm">Načítání obsahu...</div>
    <div id="elements-stream" class="space-y-8 hidden"></div>
</main>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://semffcznljmbmftbaogl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OSvxzzEtDG7zgkmaR4j5gw_2oY7otaQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadStream() {
        const slug = new URLSearchParams(window.location.search).get('p') || 'test';
        document.getElementById('page-meta-title').innerText = `${slug.toUpperCase()} | Wenix`;

        const { data, error } = await supabase
            .from('site_content')
            .select('*')
            .eq('page', slug)
            .order('sort_order', { ascending: true });

        document.getElementById('page-loading').classList.add('hidden');
        const container = document.getElementById('elements-stream');
        container.classList.remove('hidden');

        if (!data || data.length === 0) {
            container.innerHTML = `<div class="text-center py-16 text-neutral-500 font-mono text-sm">Na této stránce zatím není žádný obsah. Přidejte prvky v <a href="admin.html" class="text-teal-400 underline">administraci</a>.</div>`;
            return;
        }

        container.innerHTML = data.map(item => {
            const isBtn = item.type === 'button' || item.key.includes('btn_');

            if (isBtn) {
                let text = item.value || 'Tlačítko';
                let link = '#';
                if ((item.value || '').includes('|')) {
                    const parts = item.value.split('|');
                    text = parts[0].trim();
                    link = parts[1].trim();
                }
                return `<div><a href="${link}" class="btn-primary">${text}</a></div>`;
            } else if (item.type === 'image') {
                return `<div class="rounded-2xl overflow-hidden border border-white/10 aspect-video max-h-[460px] bg-[#111]">
                    <img src="${item.value}" class="w-full h-full object-cover" alt="${item.label}">
                </div>`;
            } else if (item.key.includes('hero') || item.key.includes('title') || item.key.includes('heading')) {
                return `<h2 class="font-bebas text-5xl md:text-7xl text-white leading-none">${item.value}</h2>`;
            } else if (item.type === 'textarea') {
                return `<div class="text-neutral-300 text-sm md:text-base leading-relaxed space-y-4">${item.value}</div>`;
            } else {
                return `<div class="text-neutral-200 text-base">${item.value}</div>`;
            }
        }).join('');
    }

    loadStream();
</script>
</body>
</html>
